[package]
name = "raea-app-check-read"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "What `raea check` reads of a video: FFmpeg's probe, and raea's own decoders standing in for FFmpeg where it isn't installed"

[dependencies]
serde_json = "1"
raea-io-home = { path = "../../../io/home" }
raea-io-media = { path = "../../../io/media", default-features = false }
raea-app-media = { path = "../../media" }
# ffmpeg's flag for every decoded frame, by its version (the one read's flashing frames)
raea-io-ffmpeg = { path = "../../../io/ffmpeg" }
# caption contrast, as `raea world` measures it (DR2)
raea-sys-measure = { path = "../../../systems/measure" }

[target.'cfg(unix)'.dependencies]
# the one read's named pipes
libc = "0.2"
