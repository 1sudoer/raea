[package]
name = "raea-io-gen-fit"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A generated model measured and fitted before a scene uses it: raea gen check, and every mesh.generate output of a run fitted by its step's size"

[dependencies]
raea-io-gen-core = { path = "../gen-core" }
# the measuring and fitting (raea-core-meshcheck)
raea-core-meshcheck = { path = "../../core/meshcheck" }
# what gen check finds, as raea's one Finding (docs/direction.feature DR3)
raea-core-facts = { path = "../../core/facts" }
serde_json = "1"
