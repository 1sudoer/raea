[package]
name = "raea-sys-foliage"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Plants grown from their species (space colonization, the pipe model, leaves and an atlas made in code), as .glb (docs/foliage.feature)"

[dependencies]
parry3d = "0.31"
