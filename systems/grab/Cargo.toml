[package]
name = "raea-sys-grab"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Procedural arms and hands (docs/hands.feature): a body reaches for a thing, takes it with one hand or two, carries it and throws it. Arm IK, hold points found on the thing's shape, fingers curled onto it, all as a function of time"

[dependencies]
# the rig, IK, limits, pose fitting and the hand prior
raea-sys-body = { path = "../body" }
# the glam Bevy 0.20 uses, so a pose passes to the engine as it is
glam = "0.33"
serde_json = "1"
